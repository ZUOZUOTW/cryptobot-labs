name: Feature proposal
description: Propose a focused product, protocol, or documentation improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Withdrawal or asset-transfer request
        paths are outside the current product boundary.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what cannot be done safely today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Explain the desired behavior without prescribing unnecessary implementation detail.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility impact
      description: Cover auth, credentials, trading, attribution, data, release, and migration concerns.
    validations:
      required: true
