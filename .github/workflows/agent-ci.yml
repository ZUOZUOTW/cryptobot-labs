name: Agent CI
on:
  pull_request:
    paths: ["apps/agent/**", "packages/trading-core/**", "packages/weex-client/**", "pnpm-lock.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x64 }
          - { os: windows-2022, label: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 11.9.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cryptobot-labs/agent test
      - run: pnpm --filter @cryptobot-labs/agent typecheck
      - run: pnpm --filter @cryptobot-labs/agent make
      - run: node scripts/verify-agent-artifact.mjs --internal-test apps/agent/out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "internal-test-unsigned-${{ matrix.label }}"
          path: apps/agent/out/make/**
