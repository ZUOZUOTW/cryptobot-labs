name: Agent CI
on:
  pull_request:
    paths: ["apps/agent/**", "packages/trading-core/**", "packages/weex-client/**", "pnpm-lock.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x64 }
          - { os: windows-2022, label: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cryptobot-labs/agent test
      - run: pnpm --filter @cryptobot-labs/agent typecheck
      - run: pnpm --filter @cryptobot-labs/agent make
      - run: node scripts/verify-agent-artifact.mjs --internal-test apps/agent/out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "internal-test-unsigned-${{ matrix.label }}"
          path: apps/agent/out/make/**
