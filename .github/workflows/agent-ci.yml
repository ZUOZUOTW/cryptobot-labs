name: Agent CI
on:
  pull_request:
    paths: ["apps/agent/**", "packages/trading-core/**", "packages/weex-client/**", "pnpm-lock.yaml"]
  workflow_dispatch:
jobs:
  internal-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x64 }
          - { os: windows-2022, label: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cryptobot-labs/agent test
      - run: pnpm --filter @cryptobot-labs/agent typecheck
      - run: pnpm --filter @cryptobot-labs/agent make
      - run: node scripts/verify-agent-artifact.mjs --internal-test apps/agent/out
      - uses: actions/upload-artifact@v4
        with:
          name: "internal-test-unsigned-${{ matrix.label }}"
          path: apps/agent/out/make/**
