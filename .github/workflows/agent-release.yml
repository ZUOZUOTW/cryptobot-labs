name: Signed Agent Release
on:
  push:
    tags: ["agent-v*"]

permissions:
  contents: read

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x64 }
          - { os: windows-2022, label: windows-x64 }
    runs-on: ${{ matrix.os }}
    env:
      AGENT_RELEASE_CHANNEL: public
      AGENT_TARGET_LABEL: ${{ matrix.label }}
      CBL_CONTROL_PLANE_ORIGIN: ${{ vars.CBL_CONTROL_PLANE_ORIGIN }}
      CBL_WEEX_BROKER_ID: ${{ vars.CBL_WEEX_BROKER_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "WINDOWS signing inputs are missing" }
          [IO.File]::WriteAllBytes("agent-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "WINDOWS_CERTIFICATE_FILE=$((Resolve-Path agent-signing.pfx).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: pnpm --filter @cryptobot-labs/agent make
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item agent-signing.pfx -Force
      - shell: bash
        run: |
          pnpm sbom --sbom-format cyclonedx --sbom-spec-version 1.6 --sbom-type application --sbom-supplier "CryptoBot Labs" --filter @cryptobot-labs/agent --out "apps/agent/out/make/agent-sbom-${AGENT_TARGET_LABEL}.cdx.json"
          find apps/agent/out/make -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.nupkg' -o -name 'RELEASES' -o -name 'agent-sbom-*.cdx.json' \) -exec shasum -a 256 {} \; | sed 's#  .*/#  #' | sort > apps/agent/out/make/SHA256SUMS
      - run: node scripts/verify-agent-artifact.mjs --public apps/agent/out/make
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: "signed-agent-${{ matrix.label }}"
          path: |
            apps/agent/out/make/**/*.zip
            apps/agent/out/make/**/*.exe
            apps/agent/out/make/**/*.nupkg
            apps/agent/out/make/**/RELEASES
            apps/agent/out/make/**/agent-sbom-*.cdx.json
  publish:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: signed-agent-*, path: release, merge-multiple: true }
      - shell: bash
        run: |
          find release -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.nupkg' -o -name 'RELEASES' -o -name 'agent-sbom-*.cdx.json' \) -exec sha256sum {} \; | sed 's#  .*/#  #' | sort > release/SHA256SUMS
      - env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --verify-tag --title "CryptoBot Labs Agent ${GITHUB_REF_NAME}" --generate-notes
          find release -type f -print0 | xargs -0 gh release upload "${GITHUB_REF_NAME}" --clobber
