name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level low
      - run: pnpm audit signatures
      - run: pnpm licenses:check
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  secret-history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan reachable Git history with checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          readonly version="8.30.1"
          readonly archive="gitleaks_${version}_linux_x64.tar.gz"
          readonly expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          readonly download="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl --fail --location --silent --show-error --output "${RUNNER_TEMP}/${archive}" "${download}"
          echo "${expected_sha256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner .
