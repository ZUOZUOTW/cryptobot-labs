name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm licenses:check
      - run: pnpm test
      - run: pnpm --filter @cryptobot-labs/executor test
      - run: pnpm --filter @cryptobot-labs/executor typecheck
      - run: pnpm --filter @cryptobot-labs/executor build
      - run: pnpm --filter @cryptobot-labs/weex-client test
      - run: pnpm --filter @cryptobot-labs/weex-client typecheck
      - run: pnpm --filter @cryptobot-labs/trading-core test
      - run: pnpm --filter @cryptobot-labs/trading-core typecheck
      - run: pnpm exec tsc --noEmit --incremental false
      - run: pnpm lint
      - run: pnpm build
        env:
          AUTH_COOKIE_SECRET: "ci-only-auth-cookie-secret-000000000000"
          DEMO_MODE: "false"
          PUBLIC_ORIGIN: "https://ci.cryptobot.invalid"
          SUPABASE_DATABASE_URL: "postgresql://cryptobot_netlify@ci-only.invalid/cryptobot"
          SUPABASE_PUBLISHABLE_KEY: "sb_publishable_ci_only_value"
          SUPABASE_URL: "https://ci-only.supabase.invalid"

  postgres-migration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: cryptobot_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cryptobot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_TEST_URL: "postgresql://postgres:postgres@127.0.0.1:5432/cryptobot_test"
      REQUIRE_POSTGRES_TEST: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:postgres

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: ignore
          name: browser-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secret-history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan reachable Git history with checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          readonly version="8.30.1"
          readonly archive="gitleaks_${version}_linux_x64.tar.gz"
          readonly expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          readonly download="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl --fail --location --silent --show-error --output "${RUNNER_TEMP}/${archive}" "${download}"
          echo "${expected_sha256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner .
