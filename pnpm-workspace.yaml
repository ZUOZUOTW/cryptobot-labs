packages:
  - "."
  - "packages/*"
  - "apps/*"

publicHoistPattern:
  - "@electron-forge/*"
  - "electron"

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  "@electron/rebuild": "4.2.0"
  # v2.1.3 backports CVE-2026-14257 while preserving the callable CommonJS API
  # required by older minimatch consumers. The registry advisory currently
  # lists only v5.0.8 as patched, so the audited exception below is locked to
  # this reviewed backport and guarded by tests.
  "brace-expansion@1": "2.1.3"
  "brace-expansion@2": "2.1.3"
  "brace-expansion@5": "5.0.8"
  "esbuild": "0.28.1"
  "js-yaml@4": "4.3.0"
  "postcss": "8.5.24"
  "tar": "7.5.22"
  "tmp": "0.2.7"
  "next>postcss": "8.5.24"
  "next>sharp": "0.35.3"

auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg

peerDependencyRules:
  allowedVersions:
    "@electron-forge/plugin-fuses>@electron/fuses": "2.1.3"

# Security patches can be newer than the dependency quarantine window.
# Keep every exception exact; never widen one to an unrestricted package range.
minimumReleaseAgeExclude:
  - "@electron/fuses@2.1.3"
  - brace-expansion@2.1.3
  - brace-expansion@5.0.8
  - electron@43.2.0
  - esbuild@0.28.1
  - js-yaml@4.3.0
  - postcss@8.5.24
  - react-dom@19.2.8
  - react-server-dom-webpack@19.2.8
  - react@19.2.8
  - tar@7.5.22
  - tmp@0.2.7
  - vite@8.1.5
