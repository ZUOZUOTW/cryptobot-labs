packages:
  - "."
  - "packages/*"
  - "apps/*"

publicHoistPattern:
  - "@electron-forge/*"
  - "electron"

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  "@electron/node-gyp": "10.2.0-electron.2"
  "next>postcss": "8.5.24"
  "next>sharp": "0.35.3"
  "postcss>nanoid": "3.3.18"

# Security-patched packages are newer than the dependency quarantine window.
# Keep these exact exceptions until they age out; never widen them to package ranges.
minimumReleaseAgeExclude:
  - nanoid@3.3.18
  - postcss@8.5.24
