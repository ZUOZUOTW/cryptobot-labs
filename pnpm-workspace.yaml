packages:
  - "."
  - "packages/*"
  - "apps/*"

publicHoistPattern:
  - "@electron-forge/*"
  - "electron"

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  "@electron/rebuild": "4.2.0"
  "brace-expansion@1": "2.1.4"
  "brace-expansion@2": "2.1.4"
  "brace-expansion@5": "5.0.9"
  "esbuild": "0.28.1"
  "fast-uri@3": "3.1.5"
  "js-yaml@4": "4.3.0"
  "postcss": "8.5.24"
  "tar": "7.5.22"
  "tmp": "0.2.7"
  "undici@6": "6.28.0"
  "undici@7": "7.29.0"
  "next>postcss": "8.5.24"
  "next>sharp": "0.35.3"

peerDependencyRules:
  allowedVersions:
    "@electron-forge/plugin-fuses>@electron/fuses": "2.1.3"

# Security patches can be newer than the dependency quarantine window.
# Keep every exception exact; never widen one to an unrestricted package range.
minimumReleaseAgeExclude:
  - "@electron/fuses@2.1.3"
  - brace-expansion@2.1.4
  - brace-expansion@5.0.9
  - electron@43.2.0
  - esbuild@0.28.1
  - fast-uri@3.1.5
  - js-yaml@4.3.0
  - postcss@8.5.24
  - react-dom@19.2.8
  - react-server-dom-webpack@19.2.8
  - react@19.2.8
  - tar@7.5.22
  - tmp@0.2.7
  - undici@6.28.0
  - undici@7.29.0
  - vite@8.1.5
