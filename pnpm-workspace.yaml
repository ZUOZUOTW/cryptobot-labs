packages:
  - "."
  - "packages/*"
  - "apps/*"

publicHoistPattern:
  - "@electron-forge/*"
  - "electron"

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  "@electron/node-gyp": "10.2.0-electron.2"
  "next>postcss": "8.5.24"
  "next>sharp": "0.35.3"

# Security-patched PostCSS is newer than the dependency quarantine window.
# Keep this exact exception until it ages out; never widen it to a package range.
minimumReleaseAgeExclude:
  - postcss@8.5.24
