[build]
  command = "node scripts/clean-next-build.mjs && node node_modules/next/dist/bin/next build --webpack"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.13.0"
  DEMO_MODE = "false"

[dev]
  command = "pnpm dev"
  targetPort = 4173
  framework = "#custom"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mascots/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
